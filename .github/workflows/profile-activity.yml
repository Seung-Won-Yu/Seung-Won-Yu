name: Refresh profile activity

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Seung-Won-Yu/Seung-Won-Yu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render and publish public activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py --publish
